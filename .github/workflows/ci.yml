# CI 冒烟（plan T0.1 / design §12）：windows-latest + MSYS2 UCRT64。
#
# 构建（mruby 产物 + demo 双 exe）→ spec → G1-G6 门禁 JSON 落工件。
# 全部 --release：debug 链接在 binutils 2.47 快照上有 ld 崩溃问题
# （docs/go-no-go.md §风险），release 链接稳定且是交付口径。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # FT/HB/brotli 是 tessell 文本栈的链接依赖（demo exe 需要）
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # 2026 msys2 命名：环境前缀统一为 mingw-w64-ucrt-x86_64-*。
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-crystal
            mingw-w64-ucrt-x86_64-shards
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ruby
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-brotli

      - name: Build + spec + gates
        run: bash scripts/build.sh

      - name: Upload gates JSON
        uses: actions/upload-artifact@v4
        with:
          name: gates-json
          path: artifacts/gates.json

      - name: Upload demo exes
        uses: actions/upload-artifact@v4
        with:
          name: demo-exes
          path: |
            bin/log_explorer.exe
            bin/log_explorer_builtin.exe

  # plan §5 P1：Linux/macOS 仅编译检查（--no-codegen 类型检查，不链接、
  # 不承诺运行）。运行承诺仍仅 Windows（R7）。
  compile-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: shards install
        run: shards install

      # crystal spec 会编译并链接 spec 二进制（需要 mruby 产物），
      # 类型检查统一走 --no-codegen 的 build 入口（spec/type_check.cr 汇总全部 spec）。
      - name: Type-check library + demo + specs
        run: |
          crystal build --no-codegen examples/log-explorer/main.cr
          crystal build --no-codegen examples/log-explorer/main_builtin.cr
          crystal build --no-codegen spec/type_check.cr
