name: tessell_mruby
version: 0.2.0
description: Optional mruby scripting layer for Tessell (API frozen at 0.2.0, G1-G6+G8 gates green).

authors:
  - ShiningRay

crystal: ">= 1.21.0"

license: MIT

dependencies:
  tessell:
    github: ShiningRay/tessell
    version: "~> 0.4"
  mrb:
    github: ShiningRay/mrb.cr
    version: "~> 0.2"

targets:
  tessell_mruby:
    main: src/tessell_mruby.cr
  log_explorer:
    main: examples/log-explorer/main.cr
  log_explorer_builtin:
    main: examples/log-explorer/main_builtin.cr
